<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3142"/>
      <stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3D7BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.55" stop-color="#AEB6C4"/>
      <stop offset="1" stop-color="#6E7686"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9DEE6"/>
      <stop offset="1" stop-color="#8C94A3"/>
    </linearGradient>
    <linearGradient id="rev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3A4154"/>
      <stop offset="1" stop-color="#151922"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- rev arc (glow + line) -->
  <path d="M 226 410 A 310 310 0 0 1 798 410" fill="none" stroke="url(#rev)" stroke-width="30" stroke-linecap="round" opacity="0.55" filter="url(#blur)"/>
  <path d="M 226 410 A 310 310 0 0 1 798 410" fill="none" stroke="url(#rev)" stroke-width="22" stroke-linecap="round"/>

  <!-- steering wheel -->
  <g filter="url(#soft)">
    <!-- spokes -->
    <path d="M 290 520 Q 512 470 734 520 L 734 585 Q 512 560 290 585 Z" fill="url(#spoke)"/>
    <path d="M 478 600 L 546 600 L 566 790 L 458 790 Z" fill="url(#spoke)"/>
    <!-- rim -->
    <circle cx="512" cy="560" r="248" fill="none" stroke="url(#rim)" stroke-width="58"/>
    <!-- hub -->
    <circle cx="512" cy="560" r="92" fill="url(#hub)" stroke="#C9CFD9" stroke-width="10"/>
    <circle cx="512" cy="560" r="26" fill="#3D7BFF"/>
    <!-- top center marker -->
    <rect x="497" y="283" width="30" height="62" rx="10" fill="#EF4444"/>
  </g>
</svg>
